<style>
.tag.themed{background:#fff1e0;color:#9a5a00}.tag.hoods{background:#e4f8ef;color:#137148}.tag.panoramic{background:#e7f6fb;color:#0d6680}.tag.private{background:#f2ecff;color:#5b37a8}.tag.multi{background:#fdecec;color:#a12a2a}
.grid>.place{min-width:0}.place .top{flex-wrap:wrap}.place .top .tag{white-space:normal}
.place .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4c5f7c;font-weight:600}
.place .ask-price{color:#0a1753}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0 8px;padding:0;list-style:none;counter-reset:s}
.how li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 52px;position:relative;font-size:14px;color:#34465f}
.how li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
[dir=rtl] .how li{padding:14px 52px 14px 14px}[dir=rtl] .how li::before{left:auto;right:14px}
.see-also[hidden]{display:none}
.place .from-price{color:#0a1753;font-weight:800}
.td{border:1px solid #cfdcf3;border-radius:14px;background:#f5f9ff;overflow:hidden;transition:box-shadow .15s}
.td[open]{background:#fff;box-shadow:0 4px 14px rgba(10,23,83,.08)}
.td summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;font-weight:800;font-size:15px;color:#0a1753;background:linear-gradient(90deg,#eaf2ff,#f5f9ff)}
.td summary::-webkit-details-marker{display:none}
.td summary:hover{background:#e2ecff}.td summary:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}
.td summary .td-ico{font-size:18px;line-height:1}
.td summary .td-label{flex:1}
.td summary .td-count{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#0a1753;color:#fff;font-size:12px;display:inline-grid;place-items:center}
.td summary .td-chev{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #cfdcf3;display:grid;place-items:center;font-size:12px;transition:transform .2s}
.td[open] summary .td-chev{transform:rotate(180deg)}
.td[open] summary{border-bottom:1px solid #e3ebf7}
.td-body{padding:12px 14px 14px;display:grid;gap:12px;font-size:14px;color:#34465f}
.td-block h4{margin:0 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#5d6f8a}
.td-block p{margin:0}.td-block ul,.td-block ol{margin:0;padding-inline-start:20px}
.td-route{display:flex;flex-wrap:wrap;gap:6px;padding:0!important;list-style:none;counter-reset:r}
.td-route li{counter-increment:r;background:#eef4ff;border-radius:999px;padding:4px 10px;font-size:13px}.td-route li::before{content:counter(r) '. ';font-weight:800;color:#16457d}
.td-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.td-block.inc li::marker{content:'✓  ';color:#137148}.td-block.exc li::marker{content:'✕  ';color:#a12a2a}
.td-market{list-style:none;padding:0!important;display:grid;gap:6px}
.td-market li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.td-market b{color:#0a1753;font-size:15px}.td-market span{font-size:13px;color:#5d6f8a}
.td-fine{font-size:12px;color:#5d6f8a;margin-top:6px!important}.td-tip{margin:0;background:#fff9ec;border:1px dashed #f0b44c;border-radius:12px;padding:8px 10px;font-size:13px}
@media(max-width:420px){.td-two{grid-template-columns:1fr}}
.tf{display:grid;gap:10px;border:1px solid #cfdcf3;border-radius:14px;background:#f8fbff;padding:14px;min-width:0}
.tf[hidden]{display:none}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.tf-field{display:grid;gap:4px;font-size:13px;font-weight:700;color:#34465f;min-width:0}
.tf input,.tf textarea,.tf select{font:inherit;font-weight:400;font-size:15px;border:1px solid #cbd8eb;border-radius:10px;padding:9px 10px;min-height:42px;width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:#fff}
.tf-vip{background:#f5f2ff;border:1px solid #c9bdf5;border-radius:10px;padding:8px 11px;font-size:12.5px;color:#2f1e78;font-weight:700}
.tf-ack{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#34465f}.tf-ack input{width:18px;min-height:18px;margin-top:2px;flex:none}
.tf-err{margin:0;color:#a12a2a;font-size:13px;font-weight:700}
.tf-send{justify-self:start}.tf-done{display:grid;gap:8px}.tf-done p{margin:0;font-weight:700;color:#137148}.tf-done .btn,.tf-done .tg-btn{justify-self:start}
@media(max-width:480px){.tf-row{grid-template-columns:1fr}}

.see-also{display:inline-block;margin:14px 0 4px;font-weight:700;color:#16457d}
</style>
