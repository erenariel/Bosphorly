<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mimo hello">
  <defs>
    <linearGradient id="mimoGoldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd565"/>
      <stop offset="100%" stop-color="#f59e2d"/>
    </linearGradient>
  </defs>
  <!-- Soft round face in Bosphorly navy (#0a1753) -->
  <ellipse cx="48" cy="54" rx="37" ry="35" fill="#0a1753" stroke="#ffd565" stroke-width="2.5"/>
  <path d="M23 38a31 29 0 0 1 34-15" fill="none" stroke="#284299" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- Perky golden wave curl on top of head -->
  <path d="M35 22c3-12 14-18 23-12 6 3 7 10 2 13-4 2-9-1-8-5 1-2 3-2 4-1" fill="none" stroke="url(#mimoGoldH)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="67" cy="13" r="2.8" fill="#ffd565"/>
  <!-- Left bright eye open with white catchlights -->
  <circle cx="34" cy="49" r="8.5" fill="#ffffff"/>
  <circle cx="34.5" cy="49.5" r="5.6" fill="#060e36"/>
  <circle cx="32.2" cy="47.2" r="2.4" fill="#ffffff"/>
  <circle cx="36.8" cy="51.6" r="1.1" fill="#ffffff"/>
  <!-- Right eye winking -->
  <path d="M54.5 50c2.5-5 12.5-5 15 0" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="69" cy="46.5" r="1.2" fill="#ffd565"/>
  <!-- Pink cheeks -->
  <ellipse cx="24" cy="60" rx="6.4" ry="4" fill="#ff8fa3" opacity=".9"/>
  <ellipse cx="72" cy="59.5" rx="6.6" ry="4.1" fill="#ff8fa3" opacity=".92"/>
  <!-- Cheerful curved smile -->
  <path d="M40 61q8 7.5 16-1" fill="none" stroke="#ffffff" stroke-width="3.3" stroke-linecap="round"/>
</svg>
