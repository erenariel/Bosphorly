  <circle cx="32" cy="45.3" r="2.7" fill="#ffffff"/>
  <circle cx="37" cy="50" r="1.3" fill="#ffffff"/>
  <!-- Right extra-bright happy eye -->
  <circle cx="62" cy="47.5" r="8.8" fill="#ffffff"/>
  <circle cx="61.5" cy="47.8" r="5.7" fill="#060e36"/>
  <circle cx="59" cy="45.3" r="2.7" fill="#ffffff"/>
