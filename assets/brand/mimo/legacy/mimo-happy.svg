  <ellipse cx="23.5" cy="58.5" rx="7" ry="4.3" fill="#ff8fa3" opacity=".95"/>
  <ellipse cx="72.5" cy="58.5" rx="7" ry="4.3" fill="#ff8fa3" opacity=".95"/>
  <!-- Joyful open curved smile -->
  <path d="M39 59.5c3 9.5 15 9.5 18 0Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M43 64.2q5 3.5 10 0" fill="#ff8fa3"/>
