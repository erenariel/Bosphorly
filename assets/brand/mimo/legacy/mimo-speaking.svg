  <circle cx="33.2" cy="46" r="2.4" fill="#ffffff"/>
  <circle cx="37.8" cy="50.3" r="1.2" fill="#ffffff"/>
  <!-- Right cheerful eye -->
  <circle cx="61" cy="48" r="8.2" fill="#ffffff"/>
  <circle cx="60.5" cy="48.3" r="5.3" fill="#060e36"/>
  <circle cx="58.2" cy="46" r="2.4" fill="#ffffff"/>
  <circle cx="62.8" cy="50.3" r="1.2" fill="#ffffff"/>
  <!-- Rosy pink cheeks -->
  <ellipse cx="25.5" cy="58.5" rx="6" ry="3.8" fill="#ff8fa3" opacity=".9"/>
  <ellipse cx="70.5" cy="58.5" rx="6" ry="3.8" fill="#ff8fa3" opacity=".9"/>
