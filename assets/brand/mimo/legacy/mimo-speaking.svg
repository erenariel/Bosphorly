<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mimo speaking">
  <defs>
    <linearGradient id="mimoGoldS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd565"/>
      <stop offset="100%" stop-color="#f59e2d"/>
    </linearGradient>
  </defs>
  <!-- Sound waves around Mimo -->
  <path d="M10 42a18 18 0 0 0 0 24" fill="none" stroke="#00bed9" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M5 36a26 26 0 0 0 0 36" fill="none" stroke="#00bed9" stroke-width="2.6" stroke-linecap="round" opacity=".65"/>
