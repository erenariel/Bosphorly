<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bosphorly – AI-first mobile hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#dbe8ff}
.hero-bg-m{background-image:linear-gradient(rgba(7,16,60,0.72),rgba(7,16,60,0.9)),url(../../../assets/images/istanbul-galata-1440.webp);background-size:cover;background-position:center}
.ai-ring-m{background:linear-gradient(90deg,#22c3c9,#f47458,#7b8cff,#22c3c9);background-size:300% 100%;animation:glowm 6s linear infinite}
@keyframes glowm{to{background-position:300% 0}}
.dotm{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c3c9;animation:blinkm 1.2s infinite}
.dotm:nth-child(2){animation-delay:.2s}.dotm:nth-child(3){animation-delay:.4s}
@keyframes blinkm{0%,80%,100%{opacity:.25}40%{opacity:1}}
.livem{animation:pulsem 2s infinite}
@keyframes pulsem{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
input::placeholder{color:#9fb0d6}
.lightm input::placeholder{color:#6b7a96}
</style>
</helmet>
<div class="hero-bg-m" style="width: 390px; height: 1180px; box-sizing: border-box; font-family: 'DM Sans', sans-serif; color: #ffffff; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px">
    <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
      <img src="../../../assets/brand/bosphorly-icon.svg" alt="Bosphorly logo" width="34" height="34" style="border-radius: 9px">
      <span style="font-weight: 800; font-size: 19px">Bosphorly<span style="color: #f47458; font-size: 12px">.com</span></span>
    </a>
    <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 14px 18px 24px">
    <div style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); font-size: 13px; font-weight: 600">
      <span class="livem" style="width: 9px; height: 9px; border-radius: 50%; background: #34d399"></span>Mimo AI is online · 23 languages
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 46px; font-weight: 800; line-height: 1.04; letter-spacing: -1px"><span style="color: #22c3c9">Ask.</span> Pick. Go.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #dbe8ff">Tell Mimo what you have in mind. Your AI travel buddy plans transfers, cruises and tours.</p>
    </div>

    <div class="ai-ring-m" style="padding: 2px; border-radius: 22px; box-shadow: 0 0 40px rgba(34,195,201,0.28)">
      <div style="background: rgba(9,19,70,0.95); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <form onSubmit="{{askTyped}}" style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <img src="../../../assets/brand/mimo/mimo-head.webp" alt="Mimo, Bosphorly's AI assistant" width="44" height="44" style="flex-shrink: 0; border-radius: 50%; background: #16236b">
            <label for="askm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask Mimo</label>
            <input id="askm" value="{{q}}" onChange="{{onQ}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: #ffffff; font: 500 17px 'DM Sans', sans-serif; outline: none">
          </div>
          <button type="submit" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border: 0; border-radius: 13px; background: #f47458; color: #0a1753; font: 800 16px 'DM Sans', sans-serif">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg>Ask Mimo
          </button>
        </form>
        <sc-if value="{{isIdle}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
              <button type="button" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #ffffff; font: 600 14px 'DM Sans', sans-serif">{{c.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{isThinking}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; color: #c9d6f5; font-size: 14px"><span style="display: inline-flex; gap: 5px"><span class="dotm"></span><span class="dotm"></span><span class="dotm"></span></span>Mimo is planning…</div>
        </sc-if>
        <sc-if value="{{isAnswer}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16)">
            <p style="margin: 0; font-size: 15px; line-height: 1.5">{{answer}}</p>
            <button type="button" style="height: 44px; border: 0; border-radius: 12px; background: #22c3c9; color: #0a1753; font: 800 14px 'DM Sans', sans-serif">{{actionA}}</button>
            <button type="button" onClick="{{reset}}" style="height: 44px; border: 0; background: transparent; color: #c9d6f5; font: 600 14px 'DM Sans', sans-serif; text-decoration: underline">Ask something else</button>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="text-align: center; color: #c9d6f5; font-size: 13px; font-weight: 600">or book directly</div>

    <div class="lightm" style="background: #ffffff; color: #0a1753; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 12px">
      <div role="tablist" aria-label="Book directly" style="display: flex; gap: 6px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <form onSubmit="{{noSubmit}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
          <label style="{{f.cell}}">{{f.label}}<input placeholder="{{f.ph}}" style="height: 46px; border: 1px solid #c9d3e6; border-radius: 11px; padding: 0 12px; font: 500 16px 'DM Sans', sans-serif; color: #0a1753; min-width: 0"></label>
        </sc-for>
        <button type="button" style="grid-column: 1 / -1; height: 50px; border: 0; border-radius: 12px; background: #0a1753; color: #ffffff; font: 800 15px 'DM Sans', sans-serif">{{cta}}</button>
      </form>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; font-size: 12px; font-weight: 600; color: #dbe8ff">
      <span>✓ Licensed local partners</span><span>✓ Clear prices first</span><span>✓ WhatsApp support</span><span>✓ 23 languages</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tab: 'transfer', q: '', ph: 0, phase: 'idle', ans: 0 };
    this.examples = ['Sunset cruise for 4 with kids…', 'Airport to Sultanahmet tonight…', '2 days with a wheelchair…'];
    this.answers = [
      ['Lovely plan! I found sunset Bosphorus cruises with family-friendly seating. Want me to compare them?', 'Compare cruises'],
      ['Sure. Share your flight number and group size, and I will line up a fixed-price private transfer.', 'See transfer prices'],
      ['I will build a step-free 2-day plan with accessible routes and easy-boarding cruises. Start with Day 1?', 'Plan Day 1'],
      ['Got it! I am putting together options for you, with clear prices before you book.', 'See options']
    ];
  }
  componentDidMount() { this.iv = setInterval(() => this.setState({ ph: (this.state.ph + 1) % this.examples.length }), 2600); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.to); }
  ask(text, idx) {
    clearTimeout(this.to);
    this.setState({ q: text, phase: 'thinking', ans: idx });
    this.to = setTimeout(() => this.setState({ phase: 'answer' }), 1200);
  }
  renderVals() {
    const s = this.state;
    const chipLabels = ['Sunset cruise with kids', 'Airport to Sultanahmet', '2 days, wheelchair'];
    const forms = {
      transfer: [[['Pick-up', 'Istanbul Airport', true], ['Drop-off', 'Hotel or address', true], ['Date & time', 'Landing time'], ['Passengers', '2']], 'See prices'],
      cruise: [[['Cruise type', 'Sunset, dinner, daytime', true], ['Date', 'Choose a day'], ['Guests', '2']], 'Compare cruises'],
      tours: [[['What to see', 'Old City, Grand Bazaar…', true], ['Date', 'Choose a day'], ['Guests', '2']], 'Find tours']
    };
    const [fl, cta] = forms[s.tab];
    const base = 'flex: 1; height: 44px; padding: 0 8px; border: 0; border-radius: 999px; font: 700 13px "DM Sans", sans-serif; ';
    const a = this.answers[s.ans] || this.answers[3];
    return {
      q: s.q, placeholder: this.examples[s.ph],
      onQ: (e) => this.setState({ q: e.target.value }),
      askTyped: (e) => { e.preventDefault(); if (s.q.trim()) this.ask(s.q, 3); },
      chips: chipLabels.map((label, i) => ({ label, pick: () => this.ask(label, i) })),
      isIdle: s.phase === 'idle', isThinking: s.phase === 'thinking', isAnswer: s.phase === 'answer',
      answer: a[0], actionA: a[1],
      reset: () => this.setState({ phase: 'idle', q: '' }),
      tabs: [['transfer', 'Transfer'], ['cruise', 'Cruise'], ['tours', 'Tours']].map(([id, label]) => ({ label, selected: s.tab === id ? 'true' : 'false', style: base + (s.tab === id ? 'background: #0a1753; color: #ffffff' : 'background: #edf1f5; color: #0a1753'), pick: () => this.setState({ tab: id }) })),
      fields: fl.map(([label, ph, wide]) => ({ label, ph, cell: 'display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; min-width: 0' + (wide ? '; grid-column: 1 / -1' : '') })),
      cta,
      noSubmit: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
