name: Deploy Bosphorly public prototype
on:
  push:
    branches: [main]
  schedule:
    # Exchange rates (tools/fetch_rates.py). TCMB publishes around 15:30 Istanbul time (12:30 UTC) on
    # working days: refresh soon after, retry an hour later, and every morning including weekends and
    # holidays (market-rate fallback when the bulletin is old). GitHub may delay scheduled runs; the
    # browser also falls back to live market rates if the file is more than 4 days old.
    - cron: '47 12 * * 1-5'
    - cron: '53 13 * * 1-5'
    - cron: '11 5 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh TCMB exchange rates (keeps the last good file on failure)
        run: python3 tools/fetch_rates.py
      - name: Home page price extract (data/home-prices.json from data/public-market-prices.json)
        run: python3 tools/build_home_prices.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          # A rerun retains artifacts from earlier attempts. Match only this upload.
          for attempt in $(seq 1 36); do
            if artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq 'select(.expired == false) | .name') && [ "$artifact" = "$ARTIFACT_NAME" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Current Pages artifact did not become visible within 180 seconds"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
