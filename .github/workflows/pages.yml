name: Deploy Bosphorly public prototype
on:
  push:
    branches: [main]
  schedule:
    # Exchange rates (tools/fetch_rates.py). TCMB publishes around 15:30 Istanbul time (12:30 UTC) on
    # working days: refresh soon after, retry an hour later, and every morning including weekends and
    # holidays (market-rate fallback when the bulletin is old). GitHub may delay scheduled runs; the
    # browser also falls back to live market rates if the file is more than 4 days old.
    - cron: '47 12 * * 1-5'
    - cron: '53 13 * * 1-5'
    - cron: '11 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh TCMB exchange rates (keeps the last good file on failure)
        run: python3 tools/fetch_rates.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
