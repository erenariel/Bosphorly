name: Deploy Bosphorly public prototype
on:
  push:
    branches: [main]
  schedule:
    # TCMB publishes the day's rates around 15:30 Istanbul time (12:30 UTC) on working days.
    - cron: '17 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh TCMB exchange rates (keeps the last good file on failure)
        run: python3 tools/fetch_rates.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
