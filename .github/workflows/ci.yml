name: Public prototype quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify structure, internal paths and JS
        run: python3 tools/check_site.py
      - name: Exchange-rate sources reachable (report only)
        continue-on-error: true
        run: python3 tools/fetch_rates.py --check
      - name: Weather source reachable (report only)
        continue-on-error: true
        run: |
          curl -fsS 'https://api.open-meteo.com/v1/forecast?latitude=41.0082&longitude=28.9784&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FIstanbul&forecast_days=16' \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['daily']; print('open-meteo:', len(d['time']), 'days from', d['time'][0], '| max', d['temperature_2m_max'][0], 'min', d['temperature_2m_min'][0], 'rain%', d['precipitation_probability_max'][0], 'code', d['weather_code'][0])"
      - name: Prevent accidental credential disclosure
        shell: bash
        run: |
          ! grep -R -n -E '(sk_live_|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----)' --include='*.html' --include='*.js' --include='*.md' .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
