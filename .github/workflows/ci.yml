name: Public prototype quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify structure, internal paths and JS
        run: python3 tools/check_site.py
      - name: Prevent accidental credential disclosure
        shell: bash
        run: |
          ! grep -R -n -E '(sk_live_|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----)' --include='*.html' --include='*.js' --include='*.md' .
