name: Deploy member API
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply pending D1 migrations (explicit opt-in)'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: member-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Test member API
        run: node --test tests/members.test.js tests/booking.test.js && python3 tests/schema.py
      - name: Apply D1 migrations, deploy Worker and configure secrets
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLAUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
          PARTNER_TOKEN: ${{ secrets.PARTNER_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN RESEND_API_KEY CODE_PEPPER PARTNER_TOKEN ADMIN_TOKEN; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Configure repository secret $key"; exit 1; fi
          done
          python3 tools/build_knowledge.py
          config=backend/wrangler.jsonc
          if grep -q 'REPLACE_BEFORE_DEPLOYMENT' "$config"; then
            if [[ "$APPLY_MIGRATIONS" != "true" ]]; then
              echo "::error::Database provisioning requires explicit migration opt-in"; exit 1
            fi
            db_id=$(npx --yes wrangler@4.166.0 d1 list --json | node -e 'const list=JSON.parse(require("fs").readFileSync(0,"utf8")); const db=list.find(d=>d.name==="bosphorly-booking"); if(db) process.stdout.write(db.uuid);')
            if [[ -z "$db_id" ]]; then
              npx --yes wrangler@4.166.0 d1 create bosphorly-booking --location weur
              db_id=$(npx --yes wrangler@4.166.0 d1 list --json | node -e 'const list=JSON.parse(require("fs").readFileSync(0,"utf8")); const db=list.find(d=>d.name==="bosphorly-booking"); if(db) process.stdout.write(db.uuid);')
            fi
            if [[ -z "$db_id" ]]; then echo "::error::Could not resolve D1 database_id for bosphorly-booking"; exit 1; fi
            echo "Resolved D1 database_id: $db_id"
            DB_ID="$db_id" CONFIG="$config" node -e 'const fs=require("fs"); const p=process.env.CONFIG; fs.writeFileSync(p, fs.readFileSync(p,"utf8").replace("REPLACE_BEFORE_DEPLOYMENT", process.env.DB_ID));'
          fi
          npx --yes wrangler@4.166.0 d1 migrations list bosphorly-booking --remote --config "$config"
          if [[ "$APPLY_MIGRATIONS" == "true" ]]; then
            npx --yes wrangler@4.166.0 d1 migrations apply bosphorly-booking --remote --config "$config"
          else
            echo "D1 migrations were listed only; no migrations applied." >> "$GITHUB_STEP_SUMMARY"
          fi
          npx --yes wrangler@4.166.0 deploy --config "$config" --keep-vars
          node -e 'const keys=["ADMIN_TOKEN","PARTNER_TOKEN","CODE_PEPPER","RESEND_API_KEY","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","YANDEX_CLIENT_ID","YANDEX_CLIENT_SECRET","FACEBOOK_CLIENT_ID","FACEBOOK_CLIENT_SECRET","APPLE_CLIENT_ID","MICROSOFT_CLIENT_ID","MICROSOFT_CLIENT_SECRET","TELEGRAM_BOT_TOKEN","TURNSTILE_SECRET","OWNER_EMAILS"]; const out={}; for(const k of keys){if(process.env[k]) out[k]=process.env[k];} process.stdout.write(JSON.stringify(out));' |
            npx --yes wrangler@4.166.0 secret bulk --config "$config"
      - name: Set Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set; skip setWebhook"
            exit 0
          fi
          node -e '
            const crypto = require("crypto");
            const secret = crypto.createHmac("sha256", process.env.CODE_PEPPER).update("tg-webhook").digest("hex");
            process.stdout.write(JSON.stringify({
              url: "https://bosphorly-booking.erennkirazz98.workers.dev/v1/telegram/webhook",
              secret_token: secret,
              allowed_updates: ["message"],
              drop_pending_updates: true
            }));
          ' | curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" --data-binary @- \
            | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log("setWebhook ok:", Boolean(r && r.ok)); if (!r || !r.ok) process.exit(1);'
